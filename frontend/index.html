<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#263d2c" />
    <meta name="description" content="Astraloom is an experimental Midnight observatory for proving a private signal against a public rule." />
    <title>Astraloom — private signals, composed in public</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>try{var t=localStorage.getItem('ASTRALOOM_THEME');document.documentElement.dataset.theme=t==='day'||t==='night'?t:matchMedia('(prefers-color-scheme: dark)').matches?'night':'day'}catch(e){}</script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
